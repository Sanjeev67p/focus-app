<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>WorkGrid</title>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>WorkGrid</h1>
  </header>

  <!-- Main Content -->
  <main>

    <!-- Task Creation Section -->
    <section id="task-creation">
      <h2>Create Task</h2>

      <form id="task-form">
        <label for="task-name">Task Name</label>
        <input
          type="text"
          id="task-name"
          name="task-name"
          placeholder="Enter task name"
          required
        >

        <button type="submit" id="add-task-button">
          Add Task
        </button>
      </form>

      <div id="status"></div>
    </section>

    <!-- Task List Section -->
    <section id="task-list">
      <h2>Tasks</h2>

      <!-- Active Tasks -->
      <div class="active-tasks">
        <h3>Active Tasks</h3>

        <ul id="active-tasks-list">
          <li class="task-item">
            <span class="task-name">Learn HTML</span>
            <span class="task-time">00:00:00</span>

            <div class="task-controls">
              <button type="button">Start</button>
              <button type="button">Pause</button>
              <button type="button">Complete</button>
              <button type="button">Delete</button>
            </div>
          </li>
        </ul>
      </div>

      <!-- Completed Tasks -->
      <div class="completed-tasks-list">
        <h3>Completed Tasks</h3>

        <ul id="completed-tasks-list">
          <li class="task-item">
            <span class="task-name">Build Portfolio</span>
            <span class="task-time">01:24:15</span>

            <div class="task-controls">
              <button type="button">Delete</button>
            </div>
          </li>
        </ul>
      </div>
    </section>

    <!-- Dashboard Section -->
    <section id="dashboard">
      <h2>Dashboard</h2>

      <div class="stats-grid">

        <div class="stat-card">
          <h3>Total Tasks</h3>
          <p id="total-tasks">0</p>
        </div>

        <div class="stat-card">
          <h3>Active Tasks</h3>
          <p id="active-tasks-count">0</p>
        </div>

        <div class="stat-card">
          <h3>Completed Tasks</h3>
          <p id="completed-tasks-count">0</p>
        </div>

        <div class="stat-card">
          <h3>Total Time Today</h3>
          <p id="total-time">0m</p>
        </div>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 WorkGrid</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
