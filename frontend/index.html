<!DOCTYPE html>
<body lang="en">
<head>
  <meta charset="UTF-8">
  <title>WorkGrid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <h1>WorkGrid</h1>

    <form id="task-form">
      <input type="text" id="task-name" placeholder="New task..." required>
      <button>Add</button>
    </form>

    <div class="controls">
      <button id="start-stop">Start</button>
      <button id="delete">Delete</button>
    </div>

    <p id="selected">No task selected</p>

    <ul id="task-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</body>
</html>
