name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show project structure
        run: ls -R

      - name: Validate frontend
        working-directory: frontend
        run: |
          test -f index.html
          test -f script.js
          test -f style.css

      - name: Success
        run: echo "Frontend is valid"