name: CI Pipeline

on:
  push:
  pull_request:

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontend files
        working-directory: frontend
        run: |
          test -f index.html
          test -f script.js
          test -f style.css

  build:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate build
        working-directory: frontend
        run: |
          echo "Building project..."
          ls
          echo "Build complete"