name: CI/CD Pipeline

on:
  push:
  pull_request:

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontend files
        working-directory: frontend
        run: |
          test -f index.html
          test -f script.js
          test -f style.css


  build:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build output
        working-directory: frontend
        run: |
          mkdir dist
          cp index.html script.js style.css dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist


  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Show deployed files
        run: |
          ls
          ls frontend-build || true